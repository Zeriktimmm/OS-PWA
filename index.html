<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Фотоотчёт ОС</title>
  
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="screen-main">
    <div class="navbar">
      <h1>Главная</h1>
      <button class="btn-create" onclick="openCreateScreen()">+ Создать</button>
    </div>
    
    <div id="main-empty" class="empty-state">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
      </div>
      <p>У вас нет документов</p>
    </div>

    <div id="reports-list" class="reports-list" style="display: none;"></div>
  </div>

  <div id="screen-create" style="display: none;">
    <div class="navbar">
      <span style="font-weight: 600; cursor: pointer; color: #64748b;" onclick="closeCreateScreen()">← Назад</span>
      <h1 style="margin-right: 40px;">Создание фотоотчета</h1>
      <div></div>
    </div>

    <div class="top-actions">
      <button class="btn-action" onclick="saveCurrentReport()">Сохранить отчет</button>
      <button class="btn-action" style="background: #10b981;" onclick="exportToExcel()">Поделиться</button>
    </div>

    <div class="selector-group">
      <label>Наименование отчета:</label>
      <select id="report-type-select" class="custom-select">
        <option value="Списание">Списание</option>
        <option value="Реализация">Реализация</option>
        <option value="Благотворительность">Благотворительность</option>
      </select>
    </div>

    <div class="table-container">
      <div class="table-header">
        <div>№</div>
        <div>Инвентарный<br>номер</div>
        <div>Фото инвентарного<br>номера</div>
        <div>Фото общего вида<br>ОС</div>
      </div>
      <div id="dynamic-rows"></div>
    </div>

    <div class="add-row-container">
      <button class="btn-add-row" onclick="addNewBlankRow()">➕ Добавить позицию</button>
    </div>
  </div>

  <div id="camera-overlay">
    <video id="video-preview" autoplay playsinline></video>
    <div class="scanner-frame-container" id="scanner-frame-wrapper">
      <div class="scanner-mask"></div>
      <div class="scanner-box">
        <div class="scanner-tip">Поместите инвентарный номер в рамку</div>
      </div>
    </div>
    <div class="camera-controls">
      <button class="cancel-cam-btn" onclick="stopCamera()">Отмена</button>
      <button class="shutter-btn" onclick="takeSnapshot()"></button>
      <div style="width: 70px;"></div>
    </div>
  </div>

  <canvas id="hidden-canvas" style="display:none;"></canvas>

  <script src="app.js"></script>
</body>
</html>
